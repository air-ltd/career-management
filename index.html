<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Declared rather than left to the browser's default probe. Without this the
      browser requests /favicon.ico at the origin root, which for a project site
      is outside the repository path and always 404s. Vite prefixes the base path
      at build time, so this resolves under /career-management-doc/.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      The web app manifest, and the tags iOS wants.

      iOS ignores the manifest for the home screen: it reads these meta tags and
      the apple-touch-icon instead, and without them an added-to-home-screen
      application opens with the browser's chrome around it. The manifest itself
      is written at build time, because the paths in it are the base path.

      The link is relative rather than absolute for the same reason: a relative
      URL resolves against wherever the application is served from, and the
      absolute one would have to have the base path written into it. Vite does
      not rewrite this attribute — it rewrites the icon's, and not this one.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Career Doc" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Career Management Document</title>
    <!--
      Apply the theme before first paint (D14).

      IndexedDB cannot be read synchronously, so awaiting it would mean painting
      with the wrong theme and flashing. This reads a deliberately narrow
      localStorage mirror instead: a theme preference is not document data, it is
      trivially reconstructible, and nothing is lost if it is dropped.

      It remains the only copy. The durable copy lives in IndexedDB, but that
      cannot be read before paint, and writing the preference twice would mean two
      sources that can disagree. Noted because the durable copy is the natural next
      step and the reason for stopping has not changed.

      Kept in sync with src/app/theme.ts — if the key or logic changes there,
      change it here too.
    -->
    <script>
      ;(function () {
        try {
          var KEY = 'cmd:theme'
          var stored = window.localStorage.getItem(KEY)
          var pref =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset['theme'] = dark ? 'dark' : 'light'
        } catch (error) {
          // Private browsing can throw on localStorage access. A wrong theme is
          // cosmetic, so fall back rather than failing to render.
          document.documentElement.dataset['theme'] = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
